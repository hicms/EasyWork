name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision || github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - working-directory: apps/web
        run: corepack pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: |
          node ../../scripts/verify-product-names.mjs
          corepack pnpm build
          corepack pnpm check:build
          node --experimental-test-module-mocks --test tests/browser-session-shutdown.test.mjs tests/skill-management-paths.test.mjs
          corepack pnpm --filter easywork-plugin-models test
          corepack pnpm exec playwright install chromium --with-deps
          corepack pnpm --filter easywork-plugin-models test:ui
          node tests/desktop-update-notice.browser.mjs
          corepack pnpm --filter easywork-provider-identity-enterprise build
          corepack pnpm --filter easywork-plugin-enterprise-collaboration build
          corepack pnpm typecheck
          corepack pnpm --filter easywork-provider-identity-enterprise typecheck
          corepack pnpm --filter easywork-plugin-enterprise-collaboration typecheck
          corepack pnpm check:versions
          corepack pnpm check:plan

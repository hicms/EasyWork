name: Windows update acceptance

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Existing acceptance-vVERSION baseline tag
        type: string
        required: true
      candidate:
        description: Draft acceptance-vVERSION candidate tag
        type: string
        required: true
      scenario:
        description: Acceptance scenarios (use all before publishing)
        type: choice
        default: all
        options: [all, delta, missing-cache, corrupt-blockmap, offline]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      # Draft release assets require push access even for this read-only lookup.
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve the candidate source before checking it
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^acceptance-v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          gh release download "$CANDIDATE_TAG" --repo hicms/EasyWork --pattern release.json --dir "$RUNNER_TEMP/easywork-candidate-source"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { readReleaseManifest, verifyReleaseSource } from './scripts/desktop-release-policy.mjs';
          import { releaseTag } from './apps/desktop/src/update-policy.ts';
          const mode = 'unsigned-acceptance';
          const candidate = readReleaseManifest(join(process.env.RUNNER_TEMP, 'easywork-candidate-source/release.json'), mode);
          if (releaseTag(candidate.version, mode) !== process.env.CANDIDATE_TAG) throw new Error('Candidate tag and manifest differ');
          verifyReleaseSource({ commit: candidate.sourceCommit, version: candidate.version, channel: candidate.channel,
            defaultBranch: process.env.DEFAULT_BRANCH, root: process.cwd() });
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${candidate.sourceCommit}\n`);
          NODE
  checks:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.source.outputs.commit }}
  installed-update:
    needs: [source, checks]
    permissions:
      # GitHub exposes draft release assets only to identities with push access.
      contents: write
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == 'all' && '["delta","missing-cache","corrupt-blockmap","offline"]' || format('["{0}"]', inputs.scenario)) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - working-directory: apps/web
        run: corepack pnpm install --frozen-lockfile
      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline }}
          CANDIDATE_TAG: ${{ inputs.candidate }}
        run: |
          foreach ($tag in @($env:BASELINE_TAG, $env:CANDIDATE_TAG)) {
            if ($tag -notmatch '^acceptance-v\d+\.\d+\.\d+-alpha\.\d+$') { throw 'Invalid acceptance tag' }
          }
          gh release download $env:BASELINE_TAG --repo hicms/EasyWork --dir "$env:RUNNER_TEMP/easywork-update/A"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download $env:CANDIDATE_TAG --repo hicms/EasyWork --dir "$env:RUNNER_TEMP/easywork-update/B"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install A and exercise actual automatic update to B
        env:
          DSH_TELEMETRY_DISABLED: '1'
          UPDATE_SCENARIO: ${{ matrix.scenario }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CANDIDATE_COMMIT: ${{ needs.source.outputs.commit }}
        run: node apps/desktop/tests/acceptance/accept-installed-windows-update.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-update-${{ matrix.scenario }}
          path: ${{ runner.temp }}/easywork-update/evidence
          if-no-files-found: warn
          retention-days: 30
